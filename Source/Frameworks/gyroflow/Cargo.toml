[package]
name = "gyroflow-toolbox"
version = "1.4.0"
authors = ["Chris Hocking <chris@latenitefilms.com>", "Adrian <adrian.eddy@gmail.com>"]
edition = "2024"
rust-version = "1.95"
description = "Connects the Gyroflow Toolbox FxPlug4 API to the Gyroflow Core Rust Engine"

[lib]
crate-type =["cdylib"]

[dependencies]
serde_json = "1.0"
gyroflow-core = { git = "https://github.com/gyroflow/gyroflow.git", default-features = false, rev = "eb695f058c65b0b6ae3eecb8631f55a91f28e54a", features = ["bundle-lens-profiles", "cache-gyro-metadata"] }
log = "0.4"
lru = "0.19"
nalgebra = { version = "0.34", features = ["serde-serialize"] }
simplelog = "0.12.2"
log-panics = { version = "2.1", features = ["with-backtrace"]}

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
